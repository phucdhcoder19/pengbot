server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Bundle có băm nội dung trong tên file (index-C0ZUdBFN.js) nên cache vĩnh viễn
  # được: nội dung đổi thì tên đổi theo.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA dùng BrowserRouter: /documents, /settings... KHÔNG có file thật tương ứng.
  # Thiếu dòng try_files này thì F5 ở trang con là 404.
  location / {
    try_files $uri $uri/ /index.html;
    # index.html không được cache, nếu không người dùng sẽ mắc kẹt ở bản cũ
    # và trỏ tới các file assets đã bị xoá.
    add_header Cache-Control "no-cache";
  }
}
