services:
  postgres:
    image: pgvector/pgvector:pg16 # ⚠️ dùng image này, KHÔNG dùng postgres thường
    environment: # (image này có sẵn extension pgvector)
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: pengbot
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes:
  pgdata:
